name: Build StatArchive APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/statarchive-release.jks"

      - name: Reconstruct and verify approved splash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/splash_exact.png app/src/main/res/drawable-nodpi/splash_exact.webp
          : > /tmp/splash_exact.b64
          cat .splash_exact_png/part01.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part02.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part03.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part04.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part05.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part06.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part07.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08a.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08b1a.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08b1b1.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08b1b2a.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08b1b2b1.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08b1b2b2.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08b2.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08c.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_webp/part08d.b64 >> /tmp/splash_exact.b64
          cat .splash_exact_png/part09.b64 >> /tmp/splash_exact.b64
          test "$(stat -c%s /tmp/splash_exact.b64)" = "132276"
          base64 --decode /tmp/splash_exact.b64 > app/src/main/res/drawable-nodpi/splash_exact.webp
          test "$(stat -c%s app/src/main/res/drawable-nodpi/splash_exact.webp)" = "99206"
          echo "a0c152dadc7e9e95a932627c75f7d011ed04b3899b6c30d3e9fbb0d57a7e6018  app/src/main/res/drawable-nodpi/splash_exact.webp" | sha256sum -c -
          file app/src/main/res/drawable-nodpi/splash_exact.webp | grep -q "Web/P image"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/statarchive-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload StatArchive APK
        uses: actions/upload-artifact@v4
        with:
          name: StatArchive-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload StatArchive AAB
        uses: actions/upload-artifact@v4
        with:
          name: StatArchive-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK for in-app updates
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/release/app-release.apk downloads/stat-archive.apk
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add downloads/stat-archive.apk
          if git diff --cached --quiet; then
            echo "Published APK is already current."
          else
            git commit -m "Publish StatArchive APK 1.5.11"
            git push origin HEAD:main
          fi

      - name: Delete temporary keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/statarchive-release.jks"
