name: Build StatArchive APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/statarchive-release.jks"

      - name: Reconstruct and verify approved splash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat .splash_exact_png/part*.b64 > /tmp/splash_exact.b64
          base64 --decode /tmp/splash_exact.b64 > app/src/main/res/drawable-nodpi/splash_exact.png
          test "$(stat -c%s app/src/main/res/drawable-nodpi/splash_exact.png)" = "662640"
          echo "57d7cb309ed5d739319532d96a995bee58bd924a06845e6871d9eda38f31cbe8  app/src/main/res/drawable-nodpi/splash_exact.png" | sha256sum -c -
          file app/src/main/res/drawable-nodpi/splash_exact.png

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/statarchive-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload StatArchive APK
        uses: actions/upload-artifact@v4
        with:
          name: StatArchive-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload StatArchive AAB
        uses: actions/upload-artifact@v4
        with:
          name: StatArchive-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK for in-app updates
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/release/app-release.apk downloads/stat-archive.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/stat-archive.apk
          if git diff --cached --quiet; then
            echo "Published APK is already current."
          else
            git commit -m "Publish StatArchive APK 1.5.11"
            git push origin HEAD:main
          fi

      - name: Delete temporary keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/statarchive-release.jks"
