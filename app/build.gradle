plugins {
    id 'com.android.application'
}

android {
    namespace 'com.statarchive.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.statarchive.app'

        minSdk 24
        targetSdk 36

        /*
         * IMPORTANT FOR APP UPDATES
         *
         * Increase versionCode for EVERY new APK.
         */
        versionCode 13

        /*
         * Human-readable version shown to users.
         */
        versionName '1.5.6'
    }

    signingConfigs {

        release {

            storeFile file(
                    System.getenv("KEYSTORE_FILE")
                            ?: "../statarchive-release.jks"
            )

            storePassword(
                    System.getenv("KEYSTORE_PASSWORD")
            )

            keyAlias(
                    System.getenv("KEY_ALIAS")
                            ?: "statarchive"
            )

            keyPassword(
                    System.getenv("KEY_PASSWORD")
            )
        }
    }

    buildTypes {

        release {

            // R8 optimization reduces DEX/resource size and startup work while
            // preserving WebView bridge methods through app/proguard-rules.pro.
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
        }
    }

    // The final splash image is reconstructed during the build from lossless text
    // chunks kept in the repository. Keeping it in drawable-nodpi prevents Android
    // from density-resampling the artwork and preserves its visual sharpness.
    sourceSets {
        main {
            res.srcDir "$buildDir/generated/splash-res"
        }
    }
}

// Rebuild the high-quality WebP splash before Android merges resources.
// Each *.b64 file is an independently Base64-encoded binary chunk, so each chunk
// must be decoded separately and the resulting bytes concatenated. Concatenating
// the Base64 strings first leaves padding characters in the middle and causes
// "Input byte array has incorrect ending byte" during CI builds.
tasks.register('prepareHighQualitySplash') {
    doLast {
        def parts = fileTree('src/main/assets') {
            include 'splash94_*.b64'
        }.files.sort { a, b -> a.name <=> b.name }

        if (parts.isEmpty()) {
            throw new GradleException('No high-quality splash image parts were found.')
        }

        def outputDir = file("$buildDir/generated/splash-res/drawable-nodpi")
        outputDir.mkdirs()
        def outputFile = new File(outputDir, 'splash_hq.webp')

        outputFile.withOutputStream { out ->
            parts.each { part ->
                def text = part.getText('UTF-8').replaceAll('\\s+', '')
                if (text.isEmpty()) {
                    throw new GradleException("Splash image part is empty: ${part.name}")
                }
                try {
                    out.write(java.util.Base64.getDecoder().decode(text))
                } catch (IllegalArgumentException ex) {
                    throw new GradleException("Invalid Base64 in splash image part: ${part.name}", ex)
                }
            }
        }

        if (outputFile.length() < 30000) {
            throw new GradleException('Generated splash image is unexpectedly small.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareHighQualitySplash')
}


dependencies {

    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
}
