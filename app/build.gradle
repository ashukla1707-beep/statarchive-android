plugins {
    id 'com.android.application'
}

android {
    namespace 'com.statarchive.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.statarchive.app'

        minSdk 24
        targetSdk 36

        /*
         * IMPORTANT FOR APP UPDATES
         *
         * Increase versionCode for EVERY new APK:
         *
         * First APK   -> 1
         * Next APK    -> 2
         * Next APK    -> 3
         * etc.
         *
         * Android uses this number to determine
         * whether an APK is newer.
         */
        versionCode 4

        /*
         * Human-readable version shown to users.
         */
        versionName '1.3.0'
    }


    /* =========================================================
       RELEASE SIGNING

       IMPORTANT:
       Every future APK update MUST use this same keystore.
       Otherwise Android will refuse to install it as an update.
       ========================================================= */

    signingConfigs {

        release {

            storeFile file(
                    System.getenv("KEYSTORE_FILE")
                            ?: "../statarchive-release.jks"
            )

            storePassword(
                    System.getenv("KEYSTORE_PASSWORD")
            )

            keyAlias(
                    System.getenv("KEY_ALIAS")
                            ?: "statarchive"
            )

            keyPassword(
                    System.getenv("KEY_PASSWORD")
            )
        }
    }


    buildTypes {

        release {

            minifyEnabled false

            signingConfig signingConfigs.release
        }
    }
}


dependencies {

    /*
     * Currently required because the manifest still
     * contains Android Browser Helper / TWA components.
     */
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'


    /*
     * Used by MainActivity.java.
     */
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation 'androidx.activity:activity:1.10.1'

    implementation 'androidx.core:core:1.15.0'
}
