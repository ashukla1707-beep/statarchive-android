plugins {
    id 'com.android.application'
}

android {
    namespace 'com.statarchive.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.statarchive.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

   signingConfigs {
    release {
        storeFile file(System.getenv("KEYSTORE_FILE") ?: "../statarchive-release.jks")
        storePassword System.getenv("KEYSTORE_PASSWORD")
        keyAlias System.getenv("KEY_ALIAS") ?: "statarchive"
        keyPassword System.getenv("KEY_PASSWORD")
    }
}

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
}
